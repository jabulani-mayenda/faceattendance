<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · FaceTrack</title><link rel="stylesheet" href="/static/app.css"></head><body class="login-page"><main class="login-card"><div class="brand-mark">F</div><p class="eyebrow">ATTENDANCE MANAGEMENT</p><h1>Welcome to FaceTrack</h1><p class="muted">Sign in to manage attendance and your organization.</p><form id="loginForm"><label>Username<input name="username" autocomplete="username" required value="admin"></label><label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="Enter password"></label><button class="btn primary full" type="submit">Sign in</button><p id="loginError" class="form-error" role="alert"></p></form><div class="login-foot">Local-first attendance platform</div></main><script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/login',{method:'POST',body:f});const d=await r.json();if(r.ok)location.href='/';else document.getElementById('loginError').textContent=d.detail||'Unable to sign in';});
</script></body></html>
